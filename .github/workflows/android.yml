name: Android build and emulator smoke test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch-upstream:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          check-latest: false
          cache: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # setup-android@v3 fails: it runs `sdkmanager tools`, a package removed
      # from the SDK repo (exit 1). The ubuntu runner already ships an SDK.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - name: Test checksum verification failures
        run: python3 src/scripts/test-verify-upstream.py
      - name: Install pinned NDK
        run: sdkmanager 'ndk;27.2.12479018'
      - name: Fetch tagged sources, build and verify all six components
        run: |
          set -euo pipefail
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          mkdir -p artifacts
          bash src/scripts/fetch-upstream.sh 2>&1 | tee artifacts/fetch-upstream.log
      - name: Record all six checksum results
        if: always()
        run: |
          set -euo pipefail
          mkdir -p artifacts
          bash src/scripts/verify-upstream.sh | tee artifacts/upstream-verification.tsv
      - uses: actions/upload-artifact@v4
        with:
          name: verified-upstream-arm64
          path: src/app/src/main/assets/arm64/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-verification
          path: artifacts/
          if-no-files-found: error

  android:
    needs: fetch-upstream
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # setup-android@v3 fails: it runs `sdkmanager tools`, a package removed
      # from the SDK repo (exit 1). The ubuntu runner already ships an SDK.
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: verified-upstream-arm64
          path: src/app/src/main/assets/arm64/
      - name: Verify transferred components before packaging
        run: bash src/scripts/verify-upstream.sh
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Accept SDK licenses and install platform
        run: |
          # sdkmanager may close stdin while yes is still writing (SIGPIPE).
          # Keep sdkmanager's exit status, without failing on yes's status.
          set +o pipefail
          yes | sdkmanager --licenses
          set -o pipefail
          sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0' 'emulator'
      # build6 workflow omitted this step; without a keystore, the release
      # signing config has no storeFile and :app:packageRelease fails with NPE.
      # Same dev-keystore approach as the build5 workflow (CI only).
      - name: Generate development keystore (CI only, not a release key)
        env:
          ANDROID_TUNNEL_KEYSTORE: ${{ github.workspace }}/src/android-tunnel-dev.jks
          ANDROID_TUNNEL_STORE_PASSWORD: android-tunnel-dev
          ANDROID_TUNNEL_KEY_PASSWORD: android-tunnel-dev
          ANDROID_TUNNEL_KEY_ALIAS: android-tunnel-dev
        run: bash src/scripts/generate-dev-keystore.sh
      - name: Unit tests and release build
        env:
          ANDROID_TUNNEL_KEYSTORE: ${{ github.workspace }}/src/android-tunnel-dev.jks
          ANDROID_TUNNEL_STORE_PASSWORD: android-tunnel-dev
          ANDROID_TUNNEL_KEY_PASSWORD: android-tunnel-dev
          ANDROID_TUNNEL_KEY_ALIAS: android-tunnel-dev
        run: |
          cd src
          gradle testReleaseUnitTest assembleRelease assembleDebug --stacktrace
      # Run #20 failed here: GitHub runners have no KVM, so the emulator
      # refuses software CPU emulation unless ANDROID_I_WANT_MY_TCG=yes.
      # TCG is slow, so give boot 1200s and keep the emulator light.
      - name: Emulator install, launch, and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 1200
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r src/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n org.example.androidtunnel/.MainActivity
            sleep 3
            mkdir -p artifacts
            adb shell screencap -p /sdcard/main.png
            adb pull /sdcard/main.png artifacts/main.png
            adb shell am start -n org.example.androidtunnel/.StatusActivity
            sleep 2
            adb shell screencap -p /sdcard/status.png
            adb pull /sdcard/status.png artifacts/status.png
            adb shell am start -n org.example.androidtunnel/.SettingsActivity
            sleep 2
            adb shell screencap -p /sdcard/settings.png
            adb pull /sdcard/settings.png artifacts/settings.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-and-ui
          path: |
            src/app/build/outputs/apk/release/*.apk
            src/app/build/outputs/apk/debug/*.apk
            src/app/build/reports/tests/**
            artifacts/*.png
